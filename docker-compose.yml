services:
  ctfd:
    image: ghcr.io/hexcore-labs/ctfd:latest
    pull_policy: always
    restart: always
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
      - CACHE_TYPE=redis
    volumes:
      - .data/CTFd/logs:/var/log/CTFd
      - uploads:/var/uploads
    depends_on:
      permissions:
        condition: service_completed_successfully
      redis:
        condition: service_started

  permissions:
    image: alpine:3.23
    user: root
    volumes:
      - .data/CTFd/logs:/var/log/CTFd
      - uploads:/var/uploads
    command: chown -R 1001:1001 /var/uploads /var/log/CTFd

  nginx:
    image: nginx:stable
    restart: always
    volumes:
      - ./conf/nginx/http.conf:/etc/nginx/nginx.conf
    depends_on:
      - ctfd

  api:
    # Built from agent-lockdown-web monorepo (packages/lockdown-api) → ghcr.io/hexcore-labs/lockdown-api
    image: ghcr.io/hexcore-labs/lockdown-api:${LOCKDOWN_API_IMAGE_TAG:-development}
    pull_policy: always
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - CTFD_URL=http://ctfd:8000
    volumes:
      # Shared with ctfd when UPLOAD_PROVIDER=filesystem (local storage mode).
      - uploads:/var/uploads
      - snapshots:/data/snapshots
    depends_on:
      redis:
        condition: service_started

  redis:
    image: redis:4
    restart: always
    volumes:
      - .data/redis:/data

volumes:
  uploads:
  snapshots:
